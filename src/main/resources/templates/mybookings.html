<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>My Bookings – Surya Car Pool</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

	<style>
		/* YOUR ORIGINAL STYLES – UNCHANGED */
		body {
			font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto;
			background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
		}

		.navbar-custom {
			background: rgba(15, 23, 42, 0.95);
			backdrop-filter: blur(8px);
		}

		.section {
			max-width: 1200px;
			margin: 2.5rem auto;
			padding: 0 1rem;
		}

		.booking-card {
			position: relative;
			background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
			border-radius: 16px;
			padding: 1.5rem;
			border: 1px solid #e5e7eb;
			box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
			transition: transform .2s ease;
			height: 100%;
		}

		.booking-card:hover {
			transform: translateY(-5px);
		}

		.booking-card::before {
			content: "";
			position: absolute;
			inset: 0;
			border-radius: 16px;
			padding: 1px;
			background: linear-gradient(135deg, #2563eb, #60a5fa);
			-webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
			-webkit-mask-composite: xor;
			mask-composite: exclude;
			pointer-events: none;
		}

		.booking-card h6 {
			color: #1e3a8a;
		}

		.status-badge {
			padding: 6px 12px;
			border-radius: 20px;
			font-size: 0.8rem;
			font-weight: 600;
			text-transform: uppercase;
		}

		.status-active {
			background: #d1fae5;
			color: #065f46;
		}

		.status-completed {
			background: #e0e7ff;
			color: #3730a3;
		}

		.status-cancelled {
			background: #fee2e2;
			color: #991b1b;
		}

		.manage-info-box {
			background: white;
			border-radius: 12px;
			padding: 10px;
			box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
			font-weight: 500;
		}
	</style>
</head>

<body>

	<!-- NAVBAR -->
	<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
		<div class="container">
			<a class="navbar-brand d-flex align-items-center" href="/home">
				<img src="/images/logo.png" style="width:60px;height:60px;border-radius:14px;">
				<div class="ms-2">
					<div class="text-white fw-bold">Surya Car Pool</div>
					<div class="text-white-50 small">Self Drive Cars Provider</div>
				</div>
			</a>
		</div>
	</nav>

	<section class="section text-center">
		<h2 class="fw-bold mb-1">My Bookings</h2>
		<p class="text-muted">View, track and manage all your car bookings</p>
	</section>

	<!-- BOOKINGS (UNCHANGED) -->
	<section class="section">
		<div class="row g-4" th:if="${not #lists.isEmpty(bookings)}">

			<div class="col-md-6 col-lg-4" th:each="booking : ${bookings}">
				<div class="booking-card">

					<div class="d-flex justify-content-between align-items-center mb-2">
						<h6 class="fw-bold mb-0" th:text="${booking.car.make + ' - ' + booking.car.model}">Car</h6>

						<span class="status-badge" th:text="${booking.status}" th:classappend="${booking.status == 'ACTIVE'} ? ' status-active' :
						  (${booking.status == 'COMPLETED'} ? ' status-completed' : ' status-cancelled')">
						</span>
					</div>

					<p class="small mb-1 booking-id">
						Booking ID: <strong th:text="${booking.id}"></strong>
					</p>

					<p class="small mb-1 booking-location">
						📍 <span th:text="${booking.pickupLocation}"></span>
					</p>

					<div class="booking-dates">
						<span th:text="${#temporals.format(booking.pickupDateTime,'dd MMM yyyy')}"></span>
						–
						<span th:text="${#temporals.format(booking.dropDateTime,'dd MMM yyyy')}"></span>
					</div>

					<p class="fw-semibold mb-3 booking-amount">
						₹ <span th:text="${booking.amount}"></span>
					</p>

					<!-- ONLY PARAMS ADDED, DESIGN UNCHANGED -->
					<button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#manageBookingModal"
						th:attr="onclick=|openManageBooking(
'${booking.id}',
'${booking.car.make}',
'${booking.pickupLocation}',
'${#temporals.format(booking.pickupDateTime,'dd MMM yyyy HH:mm')}',
'${#temporals.format(booking.dropDateTime,'dd MMM yyyy HH:mm')}',
'${booking.status}',
'${booking.car.seats}',
'${booking.car.fuelType}',
'${booking.car.transmissionType}',
'${booking.car.registrationNo}',
'${#temporals.format(booking.pickupDateTime,'yyyy-MM-dd''T''HH:mm')}',
'${#temporals.format(booking.dropDateTime,'yyyy-MM-dd''T''HH:mm')}'
)|">
						View Details
					</button>

				</div>
			</div>

		</div>

	</section>

	<!-- MODAL -->
	<div class="modal fade" id="manageBookingModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered modal-lg">
			<div class="modal-content rounded-4">

				<div class="modal-header border-0">
					<div>
						<h5 id="modalCarName"></h5>
						<small>Booking #<span id="modalBookingId"></span></small>
					</div>
					<span class="badge" id="modalStatus"></span>
				</div>

				<div class="modal-body">

					<div class="row text-center mb-3">
						<div class="col"><small>Pickup</small>
							<div class="manage-info-box" id="modalPickup"></div>
						</div>
						<div class="col"><small>Drop</small>
							<div class="manage-info-box" id="modalDrop"></div>
						</div>
						<div class="col"><small>Location</small>
							<div class="manage-info-box" id="modalLocation"></div>
						</div>
					</div>

					<div class="d-grid gap-2 mb-3">

						<button class="btn btn-danger" id="cancelBtn">Cancel Booking</button>

						<button class="btn btn-outline-primary" id="extendBtn" type="button">Extend Trip</button>

						<!-- NEW EXTEND FORM -->
						<form id="extendForm" class="border rounded p-2 d-none" method="post" action="/bookings/extend">

							<input type="hidden" name="bookingId" id="extendBookingId">

							<div class="mb-2">
								<label class="small">Pickup Date</label>
								<input type="datetime-local" class="form-control" id="extendPickupDate" readonly>
							</div>

							<div class="mb-2">
								<label class="small">New Drop Date</label>
								<input type="datetime-local" class="form-control" name="newDropDate" id="extendDropDate"
									required>
							</div>

							<div class="d-flex gap-2">
								<button class="btn btn-success btn-sm" type="submit">Confirm</button>
								<button class="btn btn-secondary btn-sm" type="button"
									onclick="hideExtendForm()">Cancel</button>
							</div>
						</form>

						<button class="btn btn-outline-secondary" id="rescheduleBtn">Reschedule</button>
						<a class="btn btn-outline-dark" id="invoiceBtn" href="#" target="_blank">
							Download Invoice
						</a>
						<button class="btn btn-outline-info" id="supportBtn">Contact Support</button>

					</div>

					<div class="border-top pt-3 small text-muted">
						<div id="modalCarMeta"></div>
					</div>

				</div>
			</div>
		</div>
	</div>
	<!-- Extend Success Modal -->
	<div class="modal fade" id="extendSuccessModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content rounded-4">

				<div class="modal-header bg-success text-white">
					<h5 class="modal-title">Trip Extended</h5>
				</div>

				<div class="modal-body text-center">
					<i class="bi bi-check-circle-fill text-success fs-1 mb-3"></i>
					<p th:text="${successMessage}">Your trip has been extended successfully.</p>
				</div>

				<div class="modal-footer justify-content-center">
					<button class="btn btn-success" onclick="redirectToBookings()">OK</button>
				</div>

			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<script>
		function openManageBooking(
			id, make, location, pickup, drop, status,
			seats, fuel, transmission, registrationNo,
			pickupISO, dropISO
		) {

			document.getElementById("modalBookingId").innerText = id;
			document.getElementById("modalCarName").innerText = make;
			document.getElementById("modalPickup").innerText = pickup;
			document.getElementById("modalDrop").innerText = drop;
			document.getElementById("modalLocation").innerText = location;
			document.getElementById("invoiceBtn").onclick = function () {
			    window.open("/bookings/invoice/" + id, "_blank");
			};

			const badge = document.getElementById("modalStatus");
			badge.innerText = status;
			badge.className = "badge " + status;

			document.getElementById("modalCarMeta").innerText =
				`Seats: ${seats} | Fuel: ${fuel} | Transmission: ${transmission} | Car No: ${registrationNo}`;
			// Cancel booking setup (RESTORED)
			const cancelBtn = document.getElementById("cancelBtn");

			if (status !== "ACTIVE") {
				cancelBtn.disabled = true;
				cancelBtn.title = "Only active bookings can be cancelled";
			} else {
				cancelBtn.disabled = false;
				cancelBtn.title = "";
			}

			cancelBtn.onclick = () => {
				if (status !== "ACTIVE") return;

				if (!confirm("Are you sure you want to cancel this booking?")) return;

				const form = document.createElement("form");
				form.method = "POST";
				form.action = "/bookings/cancel/" + id;

				document.body.appendChild(form);
				form.submit();
			};

			// Extend setup
			document.getElementById("extendBookingId").value = id;
			document.getElementById("extendPickupDate").value = pickupISO;
			document.getElementById("extendDropDate").value = dropISO;

			hideExtendForm();

			document.getElementById("extendBtn").onclick = () => {
				if (status !== "ACTIVE") {
					alert("Only ACTIVE bookings can be extended.");
					return;
				}
				showExtendForm();
			};

			document.getElementById("rescheduleBtn").onclick = () => location.href = "/bookings/reschedule/" + id;
			document.getElementById("invoiceBtn").href =
				"/bookings/invoice/" + id;
			document.getElementById("supportBtn").onclick = () => alert("Call: +91-9949425597");
		}

		function showExtendForm() {
			document.getElementById("extendForm").classList.remove("d-none");
		}

		function hideExtendForm() {
			document.getElementById("extendForm").classList.add("d-none");
		}
		function redirectToBookings() {
			window.location.href = "/mybookings/ui";
		}
	</script>
	<script th:inline="javascript">
		document.addEventListener("DOMContentLoaded", function () {

			const showExtendSuccess = /*[[${extendSuccess != null}]]*/ false;

			if (showExtendSuccess) {
				const modal = new bootstrap.Modal(
					document.getElementById('extendSuccessModal')
				);
				modal.show();
			}

		});
	</script>

</body>

</html>
