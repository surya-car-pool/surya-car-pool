<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Answers to common questions about renting a car or listing a privately owned vehicle with SuryaCarPool.">
	<meta name="theme-color" content="#0c2e4d">
	<title>FAQ | SuryaCarPool</title>
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/responsive.css}">
	<link rel="stylesheet" th:href="@{/css/landing.css}">
</head>
<body>
	<a class="visually-hidden-focusable p-2" href="#main-content">Skip to main content</a>
	<div th:replace="~{fragments/site :: header}"></div>
	<main id="main-content">
		<section class="page-hero">
			<div class="container">
				<span class="eyebrow">A little more clarity</span>
				<h1>Frequently Asked Questions</h1>
				<p>Answers about the current SuryaCarPool web experience.</p>
			</div>
		</section>
		<section class="section-pad">
			<div class="container">
				<div class="accordion" id="faq-list">
					<div class="accordion-item" th:each="entry, item : ${questions}">
						<h2 class="accordion-header" th:id="'faq-heading-' + ${item.index}">
							<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
								th:attr="data-bs-target='#faq-answer-' + ${item.index}, aria-controls='faq-answer-' + ${item.index}"
								th:text="${entry.question}">Question</button>
						</h2>
						<div class="accordion-collapse collapse" th:id="'faq-answer-' + ${item.index}"
							data-bs-parent="#faq-list" th:attr="aria-labelledby='faq-heading-' + ${item.index}">
							<div class="accordion-body text-secondary" th:text="${entry.answer}">Answer</div>
						</div>
					</div>
				</div>
				<a class="btn btn-ocean mt-4" th:href="@{/contactus/ui}">Still have a question?</a>
			</div>
		</section>
	</main>
	<div th:replace="~{fragments/site :: footer}"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
