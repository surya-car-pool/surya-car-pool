version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: surya-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: surya_db
      MYSQL_USER: surya
      MYSQL_PASSWORD: surya123
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: surya-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data: